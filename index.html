<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Once Upon a Memory Designs</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital@0;1&family=Lato:wght@300;400&display=swap" rel="stylesheet">
</head>
<body>

    <header>
        <h1>Once Upon a Memory Designs</h1>
        <p>Capturing your stories through timeless design</p>
    </header>

    <section class="gallery">
        <h2>Our Portfolio</h2>
        <div class="grid">
            <div class="card"><img src="image1.jpg" alt="Memory Design 1"><p>Custom Keepsake</p></div>
            <div class="card"><img src="image2.jpg" alt="Memory Design 2"><p>Event Stationery</p></div>
            <div class="card"><img src="image3.jpg" alt="Memory Design 3"><p>Digital Portraits</p></div>
        </div>
    </section>

    <section class="enquiry" id="contact">
        <h2>Request an Enquiry</h2>
        <form action="https://formspree.io/f/your-id-here" method="POST">
            <input type="text" name="name" placeholder="Your Name" required>
            <input type="email" name="email" placeholder="Your Email" required>
            <textarea name="message" placeholder="Tell us about your event...." required></textarea>
            <button type="submit">Send Request</button>
        </form>
    </section>

    <footer>
        <p>&copy; 2026 Once Upon a Memory Designs | onceuponamemory.com.au</p>
    </footer>

</body>
</html>
