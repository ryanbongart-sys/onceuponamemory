<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Once Upon a Memory Designs | Home</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Lato:wght@300;400;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

    <style>
        /* GLOBAL STYLES */
        * { box-sizing: border-box; }
        body { font-family: 'Lato', sans-serif; margin: 0; color: #333; line-height: 1.6; background-color: #f9f9f9; }

        /* --- HEADER --- */
        header { background-color: #10115d; color: white; width: 100%; padding: 20px 0; }
        .header-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            max-width: 2000px;
            margin: 0 auto;
            padding: 0 40px;
        }
        .header-left, .header-right { flex: 1; display: flex; align-items: center; }
        .header-left { justify-content: flex-start; }
        .header-right { justify-content: flex-end; }
        
        .logo-container { flex: 0 0 auto; padding: 0 20px; }
        .logo { max-width: 180px; height: auto; border-radius: 50%; transition: opacity 0.3s; }
        .logo:hover { opacity: 0.8; }

        /* BUTTONS & SEARCH */
        .nav-btn {
            padding: 10px 20px;
            background: rgba(255,255,255,0.1);
            color: white;
            text-decoration: none;
            border: 1px solid rgba(255,255,255,0.4);
            border-radius: 4px;
            text-transform: uppercase;
            font-size: 0.8rem;
            letter-spacing: 1px;
            transition: 0.3s;
        }
        .nav-btn:hover { background: #bc936a; border-color: #bc936a; }

        .header-search form {
            display: flex;
            border: 1px solid rgba(255,255,255,0.4);
            border-radius: 25px;
            overflow: hidden;
            background: rgba(255,255,255,0.1);
        }
        .search-input { background: transparent; border: none; color: white; padding: 10px 15px; width: 180px; outline: none; }
        .search-button { background: transparent; border: none; color: white; padding: 0 20px; cursor: pointer; font-weight: 700; transition: 0.3s; }
        .search-button:hover { background: rgba(255,255,255,0.2); }

        /* GALLERY PREVIEW */
        .gallery { padding: 80px 20px; max-width: 1100px; margin: auto; }
        .gallery h2 { text-align: center; font-family: 'Playfair Display', serif; font-size: 2.5rem; margin-bottom: 40px; }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 30px; }
        .card { background: white; padding: 15px; border: 1px solid #eee; transition: 0.3s; text-align: center; }
        .card:hover { box-shadow: 0 10px 20px rgba(0,0,0,0.05); }
        .card img { width: 100%; height: auto; border-radius: 2px; }

        /* ENQUIRY FORM */
        .enquiry { background: #222; color: white; padding: 80px 20px; text-align: center; }
        .enquiry h2 { font-family: 'Playfair Display', serif; margin-bottom: 30px; }
        .enquiry-form { max-width: 600px; margin: auto; display: flex; flex-direction: column; }
        .enquiry-form input, .enquiry-form textarea { margin-bottom: 15px; padding: 15px; border-radius: 4px; border: none; }
        
        .file-upload-wrapper { 
            background: rgba(255,255,255,0.05); 
            padding: 20px; 
            border: 1px dashed rgba(255,255,255,0.3); 
            margin-bottom: 15px; 
            text-align: left; 
        }
        .upload-label { display: block; margin-bottom: 10px; font-size: 0.9rem; color: #bc936a; }
        .submit-btn { background: #10115d; color: white; padding: 18px; border: none; cursor: pointer; font-weight: 700; font-size: 1rem; border-radius: 4px; transition: 0.3s; }
        .submit-btn:hover { background: #bc936a; }

        /* FOOTER */
        footer { background: #10115d; color: white; padding: 50px 20px; text-align: center; }
        .social-links { display: flex; justify-content: center; gap: 20px; margin-top: 20px; }
        .social-btn { width: 45px; height: 45px; border-radius: 50%; border: 1px solid rgba(255,255,255,0.3); color: white; display: flex; align-items: center; justify-content: center; text-decoration: none; transition: 0.3s; }
        .social-btn:hover { background: white; color: #10115d; transform: translateY(-3px); }

        /* MOBILE */
        @media (max-width: 768px) {
            .header-container { flex-direction: column; gap: 15px; }
            .header-left, .header-right { justify-content: center; width: 100%; }
        }
    </style>
</head>
<body>

<header>
    <div class="header-container">
        <div class="header-left">
            <a href="gallery.html" class="nav-btn">View Gallery</a>
        </div>
        <div class="logo-container">
            <a href="index.html"><img src="./logo.jpg" alt="Once Upon a Memory Designs" class="logo"></a>
        </div>
        <div class="header-right">
            <div class="header-search">
                <form onsubmit="event.preventDefault();">
                    <input type="text" placeholder="Search..." class="search-input">
                    <button type="button" class="search-button">SEARCH</button>
                </form>
            </div>
        </div>
    </div>
</header>

<section class="gallery">
    <h2>Our Latest Designs</h2>
    <div class="grid">
        <div class="card" data-category="wedding gold">
            <img src="./design1.jpg" alt="Wedding Invitation">
            <h3>Gold Floral Wedding</h3>
        </div>
        <div class="card" data-category="baby shower blue">
            <img src="./design2.jpg" alt="Baby Shower">
            <h3>Baby Shower Suite</h3>
        </div>
    </div>
</section>

<section class="enquiry">
    <h2>Custom Enquiries</h2>
    <form class="enquiry-form" action="https://formspree.io/f/your-id" method="POST" enctype="multipart/form-data">
        <input type="text" name="name" placeholder="Full Name" required>
        <input type="email" name="email" placeholder="Email Address" required>
        
        <div class="file-upload-wrapper">
            <label class="upload-label"><i class="fa-solid fa-image"></i> Upload Design Inspiration</label>
            <input type="file" name="attachment" accept="image/*" multiple>
        </div>

        <textarea name="message" rows="5" placeholder="Tell us about your event details..."></textarea>
        <button type="submit" class="submit-btn">SEND REQUEST</button>
    </form>
</section>

<footer>
    <p>&copy; 2026 Once Upon a Memory Designs | Geelong, VIC</p>
    <div class="social-links">
        <a href="#" class="social-btn"><i class="fa-brands fa-instagram"></i></a>
        <a href="#" class="social-btn"><i class="fa-brands fa-facebook-f"></i></a>
    </div>
</footer>

</body>
</html>
